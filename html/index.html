<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <title>Mechaniker Tablet</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="app" class="hidden">
        <div class="tablet">
            <header class="bar">
                <div class="brand">
                    <span class="dot"></span>
                    <span class="title">REALTUNER OBD-II</span>
                </div>
                <div class="meta">
                    <span id="plate" class="tag">----</span>
                    <span id="vin"   class="tag mono">VIN ---</span>
                    <button id="btn-close" class="close">&times;</button>
                </div>
            </header>

            <nav class="tabs">
                <button data-tab="diag"    class="active">Diagnose</button>
                <button data-tab="scan">Teile & Scan</button>
                <button data-tab="upgrade">Upgrades</button>
                <button data-tab="history">Historie</button>
            </nav>

            <section id="tab-diag" class="tab active">
                <div class="grid diag-grid" id="diag-grid"></div>
                <div class="panel">
                    <h3>Fehlercodes</h3>
                    <ul id="dtc-list"></ul>
                </div>
                <div class="panel">
                    <h3>Service</h3>
                    <div id="service-info"></div>
                </div>
            </section>

            <section id="tab-scan" class="tab">
                <div class="panel">
                    <h3>Installierte Teile</h3>
                    <table class="data" id="parts-installed"><thead><tr><th>Slot</th><th>Teil</th><th>Zustand</th></tr></thead><tbody></tbody></table>
                </div>
                <div class="panel">
                    <h3>Freie Slots</h3>
                    <table class="data" id="parts-missing"><thead><tr><th>Slot</th><th>Optionen</th></tr></thead><tbody></tbody></table>
                </div>
                <button id="btn-rescan" class="primary">Neu scannen</button>
            </section>

            <section id="tab-upgrade" class="tab">
                <div class="panel">
                    <h3>Verfügbare Upgrades</h3>
                    <table class="data" id="parts-upgrade"><thead><tr><th>Slot</th><th>Bestes Teil</th><th>Qualität</th></tr></thead><tbody></tbody></table>
                </div>
            </section>

            <section id="tab-history" class="tab">
                <div class="panel">
                    <h3>Reparatur-Historie</h3>
                    <table class="data" id="history-table"><thead><tr><th>Zeit</th><th>Aktion</th><th>Mechaniker</th></tr></thead><tbody></tbody></table>
                </div>
            </section>

            <footer class="bar">
                <span id="me"></span>
                <span id="mode"></span>
            </footer>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
