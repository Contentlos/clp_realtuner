<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>Realtuner</title>
<style>
    body { margin:0; font-family:system-ui,Segoe UI,Arial,sans-serif; background:#0d0e13; color:#e8ecf0; }
    .wrap { padding:18px; }
    h1 { font-size:18px; margin:0 0 14px; color:#ffb648; }
    button { width:100%; padding:12px; margin:6px 0; background:#1a1c22; border:1px solid #2a2e38;
             border-radius:8px; color:#e8ecf0; cursor:pointer; font-size:14px; }
    button:hover { background:#262a33; }
    small { color:#8a8f98; }
</style>
</head>
<body>
<div class="wrap">
    <h1>Realtuner</h1>
    <small>Tuning / Wartung / Termine</small>
    <button onclick="openTablet()">Tablet oeffnen</button>
    <button onclick="emergency()">Notfall-Anruf</button>
    <button onclick="pickup()">Abhol-Service anfordern</button>
</div>
<script>
    function post(path, data) {
        return fetch('https://' + (window.GetParentResourceName ? GetParentResourceName() : 'clp_realtuner') + '/' + path, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data || {}),
        }).catch(()=>{});
    }
    function openTablet() { post('phone:openTablet'); }
    function emergency() { post('phone:emergency'); }
    function pickup()    { post('phone:pickup'); }
</script>
</body>
</html>
